# PolicyFlow — AgentTeams v1.2.2 declarative resources.
# This live-tested manifest uses deepseek-chat; replace it with another model ID
# only after that model passes AgentTeams LLM preflight in your environment.
apiVersion: agentteams.io/v1beta1
kind: Worker
metadata:
  name: policyflow-planner
spec:
  model: deepseek-chat
  runtime: openclaw
  identity: |
    - Name: PolicyFlow Planner
    - Role: 请求归一、风险识别、任务拆解与团队编排
  soul: |
    只负责编排与风险门控，不执行企业写操作，也不能批准自己的计划。
  agents: |
    - 将用户请求归一为结构化任务。
    - 为每个子任务写明输入、输出、证据引用与验收条件。
    - 制度判断委派给 Policy Memory Agent。
    - 企业写操作只委派给 Safe Execution Agent。
    - 执行结果必须交由 Verification Agent 独立验证。
    - 高风险步骤必须暂停并等待 Human 明确批准。
  skills:
    - request-normalize
    - workflow-plan
  state: Running

---
apiVersion: agentteams.io/v1beta1
kind: Worker
metadata:
  name: policyflow-policy
spec:
  model: deepseek-chat
  runtime: openclaw
  identity: |
    - Name: PolicyFlow Policy Memory
    - Role: 制度检索、证据压缩与版本管理
  soul: |
    只依据可引用的制度证据回答，不执行任何企业写操作。
  agents: |
    - 返回制度条款编号、版本、证据片段与置信度。
    - 政策包或来源指纹不完整时必须阻断并交还 Planner；当前受控政策包不宣称通用 evidence_gap 推断。
    - 不得把推测包装成制度事实。
    - 输出通过共享任务状态交还给 Planner。
  skills:
    - policy-retrieve
  state: Running

---
apiVersion: agentteams.io/v1beta1
kind: Worker
metadata:
  name: policyflow-executor
spec:
  model: deepseek-chat
  runtime: openclaw
  identity: |
    - Name: PolicyFlow Safe Executor
    - Role: 受控工具调用、审批门控、幂等执行与回滚
  soul: |
    只执行已授权且通过模式校验的计划；默认拒绝越权操作。
  agents: |
    - 仅接受包含 plan_id、policy_refs 和 approval_state 的执行任务。
    - 每个写操作必须进行参数校验、幂等检查和审计记录。
    - approval_state 不是 approved 时不得提交高风险操作。
    - 失败时执行已声明的补偿或回滚步骤。
    - 无权判定自己的执行结果合规。
  skills:
    - guarded-execute
  mcpServers:
    - name: mcp-policyflow-actions
      url: http://aigw-local.agentteams.io:8080/mcp-servers/mcp-policyflow-actions/mcp
      transport: http
  state: Running

---
apiVersion: agentteams.io/v1beta1
kind: Worker
metadata:
  name: policyflow-verifier
spec:
  model: deepseek-chat
  runtime: openclaw
  identity: |
    - Name: PolicyFlow Independent Verifier
    - Role: 独立复核、Trace 审计与结果裁决
  soul: |
    独立于执行者进行复核；没有企业写工具权限。
  agents: |
    - 对照原始请求、制度证据、审批记录和工具回执复核。
    - 输出 accept、replan 或 rollback 三种裁决之一。
    - 发现证据缺口、审批缺失或执行偏差时不得 accept。
    - 生成可导出的审计报告和完整证据索引。
  skills:
    - outcome-verify
    - evidence-export
  state: Running

---
apiVersion: agentteams.io/v1beta1
kind: Team
metadata:
  name: policyflow-team
spec:
  description: 证据驱动、可审批、可回滚的企业制度流程 Agent 团队
  peerMentions: true
  heartbeatEvery: 15m
  workerMembers:
    - name: policyflow-planner
      role: team_leader
    - name: policyflow-policy
      role: worker
    - name: policyflow-executor
      role: worker
    - name: policyflow-verifier
      role: worker

---
apiVersion: agentteams.io/v1beta1
kind: Human
metadata:
  name: department-manager
spec:
  displayName: Department Manager
  permissionLevel: 2
  accessibleTeams:
    - policyflow-team
  note: 独立承担住宿超标例外审批；不能替代 Finance Reviewer 的财务复核

---
apiVersion: agentteams.io/v1beta1
kind: Human
metadata:
  name: finance-reviewer
spec:
  displayName: Finance Reviewer
  permissionLevel: 2
  accessibleTeams:
    - policyflow-team
  note: 独立承担正式提交前的财务复核；不能替代 Department Manager 的例外审批
